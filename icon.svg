<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>

    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0%"   stop-color="#0c1c38"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Bar gradients -->
    <linearGradient id="b1" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"   stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="b2" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"   stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="b3" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"   stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Trend line gradient -->
    <linearGradient id="lineG" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%"   stop-color="#3b82f6"/>
      <stop offset="50%"  stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Background radial highlight (upper-right) -->
    <radialGradient id="bgGlow" cx="72%" cy="26%" r="44%">
      <stop offset="0%"   stop-color="#38bdf8" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <!-- Top-dot halo -->
    <radialGradient id="dotHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#34d399" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow filter for trend line -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blurred"/>
      <feMerge>
        <feMergeNode in="blurred"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>

  <!-- ── Background ── -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Ambient radial light (upper-right, where the trend peaks) -->
  <circle cx="366" cy="140" r="230" fill="url(#bgGlow)"/>

  <!-- ── 3 ascending bars ──
       All bars share the same bottom (y=430).
       Bar widths: 96 px, horizontal gaps: 14 px.
       Total width: 3×96 + 2×14 = 316 px → start x = (512-316)/2 = 98
  -->

  <!-- Bar 1 (shortest) -->
  <rect x="98"  y="310" width="96" height="120" rx="14" fill="url(#b1)"/>
  <!-- Inner highlight -->
  <rect x="98"  y="310" width="96" height="36"  rx="14" fill="rgba(255,255,255,0.07)"/>

  <!-- Bar 2 (medium) -->
  <rect x="208" y="230" width="96" height="200" rx="14" fill="url(#b2)"/>
  <rect x="208" y="230" width="96" height="44"  rx="14" fill="rgba(255,255,255,0.07)"/>

  <!-- Bar 3 (tallest) -->
  <rect x="318" y="140" width="96" height="290" rx="14" fill="url(#b3)"/>
  <rect x="318" y="140" width="96" height="56"  rx="14" fill="rgba(255,255,255,0.09)"/>

  <!-- ── Baseline ── -->
  <line x1="72" y1="434" x2="440" y2="434"
        stroke="#67e8f9" stroke-width="4" stroke-linecap="round" opacity="0.18"/>

  <!-- ── Trend line — glow layer ──
       Passes through the top-center of each bar:
         Bar 1 → (146, 310)   Bar 2 → (256, 230)   Bar 3 → (366, 140)
       Smooth cubic bezier segments.
  -->
  <path d="M 146 310 C 201 310 201 230 256 230 C 311 230 311 140 366 140"
        fill="none"
        stroke="url(#lineG)"
        stroke-width="22"
        stroke-linecap="round"
        filter="url(#glow)"
        opacity="0.55"/>

  <!-- Trend line — crisp layer -->
  <path d="M 146 310 C 201 310 201 230 256 230 C 311 230 311 140 366 140"
        fill="none"
        stroke="url(#lineG)"
        stroke-width="22"
        stroke-linecap="round"/>

  <!-- ── Trend dots ── -->
  <circle cx="146" cy="310" r="13" fill="#3b82f6"/>
  <circle cx="256" cy="230" r="13" fill="#67e8f9"/>

  <!-- Top dot — halo -->
  <circle cx="366" cy="140" r="46" fill="url(#dotHalo)"/>
  <!-- Top dot — outer ring -->
  <circle cx="366" cy="140" r="22" fill="none" stroke="#34d399" stroke-width="3" opacity="0.4"/>
  <!-- Top dot — fill -->
  <circle cx="366" cy="140" r="16" fill="#34d399"/>
  <!-- Top dot — specular glint -->
  <circle cx="360" cy="133" r="5"  fill="white" opacity="0.55"/>

</svg>
